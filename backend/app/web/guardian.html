<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SunoSafe Guardian</title>
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #5b6270; --line: #e3e6eb;
    --accent: #2f5bd3; --info: #6b7280; --low: #3a7d44; --medium: #b7791f; --high: #c2410c; --critical: #b91c1c;
    --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --panel: #171a21; --text: #e8eaee; --muted: #a0a7b4; --line: #2a2f3a;
            --accent: #7aa2ff; --chip: #222733; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
           padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 1.15rem; }
  header small { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 16px; padding: 16px 20px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  h3 { font-size: .95rem; margin: 18px 0 8px; }
  button, input, textarea { font: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--chip); color: var(--text);
           border-radius: 8px; padding: 6px 12px; min-height: 36px; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li button { width: 100%; text-align: left; display: block; margin-bottom: 8px; padding: 10px; background: transparent; }
  ul.list li button[aria-current="true"] { border-color: var(--accent); background: var(--chip); }
  .sev { display: inline-block; font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
         color: #fff; border-radius: 999px; padding: 1px 9px; margin-right: 6px; }
  .sev.info { background: var(--info); } .sev.low { background: var(--low); } .sev.medium { background: var(--medium); }
  .sev.high { background: var(--high); } .sev.critical { background: var(--critical); }
  .meta { color: var(--muted); font-size: .85rem; }
  .timeline { border-left: 2px solid var(--line); margin-left: 6px; padding-left: 14px; }
  .ev { margin-bottom: 12px; }
  .ev .t { font-weight: 600; }
  details pre { white-space: pre-wrap; word-break: break-word; background: var(--chip); padding: 10px; border-radius: 8px;
                font-size: .8rem; max-height: 320px; overflow: auto; }
  .chips span { display: inline-block; background: var(--chip); border-radius: 6px; padding: 2px 8px; margin: 0 6px 6px 0;
                font-family: ui-monospace, Consolas, monospace; font-size: .82rem; word-break: break-all; }
  .step { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0;
          border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .step .s { font-size: .8rem; color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  textarea, input[type=password] { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
                                   border-radius: 8px; padding: 8px; }
  .empty { color: var(--muted); }
  #status { min-height: 1.5em; }
</style>
</head>
<body>
<header>
  <div>
    <h1>SunoSafe Guardian</h1>
    <small>Investigation timeline for family members and analysts</small>
  </div>
  <div class="row">
    <button id="refresh" type="button">Refresh</button>
  </div>
</header>

<div id="auth" hidden style="padding:16px 20px">
  <section>
    <h2>Access token required</h2>
    <p class="meta">This backend is protected. Enter the API token configured on the server.</p>
    <label for="token">Token</label>
    <div class="row"><input id="token" type="password" autocomplete="off"><button id="save-token" class="primary" type="button">Continue</button></div>
  </section>
</div>

<main id="app">
  <section aria-labelledby="inc-h">
    <h2 id="inc-h">Incidents</h2>
    <ul id="incidents" class="list" aria-live="polite"></ul>
    <h3>Blocked sites</h3>
    <div id="blocklist" class="chips"></div>
  </section>
  <section aria-labelledby="detail-h">
    <h2 id="detail-h">Details</h2>
    <p id="status" role="status" class="meta"></p>
    <div id="detail"><p class="empty">Choose an incident to see its evidence.</p></div>
  </section>
</main>

<script>
"use strict";
// SECURITY: incident data contains attacker-written text (scam messages, URLs).
// Never use innerHTML with data. Every value goes through textContent via el().
const TOKEN_KEY = "sunosafe-guardian-token";
let token = "";
try { token = sessionStorage.getItem(TOKEN_KEY) || ""; } catch (_) {}
let selected = null;

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}

async function api(path, options = {}) {
  const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
  if (token) headers.Authorization = "Bearer " + token;
  const res = await fetch(path, { ...options, headers });
  if (res.status === 401) { showAuth(); throw new Error("unauthorised"); }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  const type = res.headers.get("content-type") || "";
  return type.includes("json") ? res.json() : res.text();
}

function showAuth() {
  document.getElementById("auth").hidden = false;
  document.getElementById("app").hidden = true;
}

function sev(level) { return el("span", { class: "sev " + level }, level); }
function setStatus(text) { document.getElementById("status").textContent = text; }
const fmt = ts => new Date(ts).toLocaleString();

async function loadList() {
  const [incidents, blocks] = await Promise.all([api("/api/incidents"), api("/api/blocklist")]);
  const ul = document.getElementById("incidents");
  ul.replaceChildren(...(incidents.length ? incidents.map(i =>
    el("li", {}, el("button", { type: "button", "aria-current": String(i.id === selected),
      onclick: () => { selected = i.id; loadList(); loadDetail(i.id); } },
      el("div", {}, sev(i.severity), "#" + i.id + " " + i.title),
      el("div", { class: "meta" }, i.status + " · updated " + fmt(i.updated_at))))) :
    [el("li", { class: "empty" }, "No incidents yet.")]));
  const bl = document.getElementById("blocklist");
  bl.replaceChildren(...(blocks.length ? blocks.map(b => el("span", { title: b.reason }, b.kind + ": " + defang(b.value)))
    : [el("p", { class: "empty" }, "Nothing blocked yet.")]));
}

function defang(v) { return v.replace(/^http/, "hxxp").replace(/\./g, "[.]"); }

async function loadDetail(id) {
  const d = await api("/api/incidents/" + id);
  const box = document.getElementById("detail");
  const reasons = d.rationale.filter(r => r.text);
  box.replaceChildren(
    el("div", {}, sev(d.severity), el("strong", {}, "#" + d.id + " " + d.title)),
    el("p", { class: "meta" }, "Status: " + d.status + " · opened " + fmt(d.created_at) + " · kind: " + d.kind),

    el("h3", {}, "Why it was flagged"),
    reasons.length ? el("ul", {}, reasons.map(r => el("li", {}, r.text,
      r.evidence && r.evidence.length ? el("div", { class: "meta" }, "evidence: " + r.evidence.join(", ")) : null)))
      : el("p", { class: "empty" }, "No reasons recorded."),

    el("h3", {}, "Recovery steps"),
    d.steps.length ? el("div", {}, d.steps.map(s => el("div", { class: "step" },
      el("div", {}, el("div", {}, s.title), el("div", { class: "s" }, s.detail)),
      el("div", { class: "row" }, el("span", { class: "s" }, s.status),
        s.code === "block_link" ? el("span", { class: "s" }, "(done by the user's approved block action)") : [
          el("button", { type: "button", onclick: () => setStep(d.id, s.code, "done") }, "Mark done"),
          el("button", { type: "button", onclick: () => setStep(d.id, s.code, "skipped") }, "Skip")]))))
      : el("p", { class: "empty" }, "No steps."),

    el("h3", {}, "Indicators"),
    el("div", { class: "chips" }, d.indicators.length ? d.indicators.map(i =>
      el("span", {}, i.kind + ": " + (i.kind === "url" || i.kind === "domain" ? defang(i.value) : i.value)))
      : el("p", { class: "empty" }, "None.")),

    el("h3", {}, "Timeline (with tool provenance)"),
    el("div", { class: "timeline" }, d.events.map(e => el("div", { class: "ev" },
      el("div", { class: "t" }, e.level ? sev(e.level) : null, e.summary),
      el("div", { class: "meta" }, fmt(e.ts) + " · " + e.type + " · source: " + e.source),
      el("details", {}, el("summary", {}, "Evidence"), el("pre", {}, JSON.stringify(e.data, null, 2)))))),

    el("h3", {}, "Notes"),
    d.notes.length ? el("ul", {}, d.notes.map(n => el("li", {}, n.text,
      el("div", { class: "meta" }, n.author + " · " + fmt(n.ts))))) : el("p", { class: "empty" }, "No notes yet."),
    el("label", { for: "note" }, "Add a note"),
    el("textarea", { id: "note", rows: "2", maxlength: "2000" }),
    el("div", { class: "row", style: "margin-top:8px" },
      el("button", { type: "button", onclick: () => addNote(d.id) }, "Save note"),
      el("button", { type: "button", class: "primary", onclick: () => showSummary(d.id) }, "Report summary for 1930")),
    el("pre", { id: "summary", hidden: "" })
  );
}

async function setStep(id, code, status) {
  try { await api(`/api/incidents/${id}/steps/${encodeURIComponent(code)}`,
                  { method: "PATCH", body: JSON.stringify({ status, actor: "guardian" }) });
        setStatus("Step updated."); await loadDetail(id); await loadList();
  } catch (e) { setStatus("Could not update step: " + e.message); }
}

async function addNote(id) {
  const text = document.getElementById("note").value.trim();
  if (!text) return;
  try { await api(`/api/incidents/${id}/notes`, { method: "POST", body: JSON.stringify({ text, author: "guardian" }) });
        setStatus("Note saved."); await loadDetail(id);
  } catch (e) { setStatus("Could not save note: " + e.message); }
}

async function showSummary(id) {
  const text = await api(`/api/incidents/${id}/summary`);
  const pre = document.getElementById("summary");
  pre.textContent = text; pre.hidden = false;
}

async function refresh() {
  try { await loadList(); if (selected) await loadDetail(selected); setStatus(""); }
  catch (e) { if (e.message !== "unauthorised") setStatus("Could not load: " + e.message); }
}

document.getElementById("refresh").addEventListener("click", refresh);
document.getElementById("save-token").addEventListener("click", () => {
  token = document.getElementById("token").value.trim();
  try { sessionStorage.setItem(TOKEN_KEY, token); } catch (_) {}
  document.getElementById("auth").hidden = true;
  document.getElementById("app").hidden = false;
  refresh();
});
refresh();
// Auto-refresh, but never wipe a note the guardian is typing.
setInterval(() => {
  const note = document.getElementById("note");
  if (note && note.value.trim()) loadList().catch(() => {}); else refresh();
}, 15000);
</script>
</body>
</html>
